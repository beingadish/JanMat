server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset files are immutable → cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the janmat-api service, stripping the /api
    # prefix. Using a variable + Docker's embedded DNS resolver lets nginx
    # start even if the backend isn't up yet, and re-resolve on restart.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $janmat_api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $janmat_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KYC uploads are multipart ZIPs — allow a generous body size.
        client_max_body_size 20m;
    }
}
